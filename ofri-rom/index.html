<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="theme-color" content="#f1eeff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="קניות - עפרי ורום" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>קניות לבית - עפרי ורום</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=to-buy-tab-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">עפרי ורום</p>
          <h1>קניות לבית</h1>
        </div>
        <div class="save-pill" id="saveStatus">נשמר במכשיר</div>
      </header>

      <section class="needed-card" aria-labelledby="neededTitle">
        <div class="card-heading">
          <div>
            <h2 id="neededTitle">לקנות עכשיו</h2>
            <p id="neededSummary">אין כרגע מוצרים שסומנו כחסרים.</p>
          </div>
          <strong id="neededCount">0</strong>
        </div>
        <div id="neededList" class="needed-list" aria-live="polite"></div>
        <div class="quick-actions">
          <button id="shoppingListButton" class="secondary-button list-button" type="button">רשימת קניות</button>
          <label class="secondary-button scan-button" for="receiptCamera">סריקת קבלה</label>
          <label class="secondary-button upload-button" for="receiptFile">העלאת קבלה</label>
          <button id="clearButton" class="secondary-button" type="button">סיימנו קנייה</button>
        </div>
      </section>

      <form id="addForm" class="add-form">
        <input id="newItemInput" type="text" autocomplete="off" placeholder="להוסיף מוצר לרשימה" />
        <button type="submit">הוסף</button>
      </form>

      <details class="receipt-card">
        <summary>
          <span>ללמוד מקבלה</span>
          <small id="learnSummary">הסוכן זוכר מוצרים שקניתם.</small>
        </summary>
        <div class="receipt-body">
          <textarea id="receiptInput" rows="5" placeholder="מדביקים כאן טקסט מקבלה או מאישור הזמנה"></textarea>
          <div class="receipt-actions">
            <label class="secondary-button file-button" for="receiptFile">
              העלאת PDF/טקסט
            </label>
            <button id="learnReceiptButton" type="button">למד מהקבלה</button>
          </div>
        </div>
      </details>

      <section class="list-section" aria-labelledby="allItemsTitle">
        <div class="list-heading">
          <div>
            <h2 id="allItemsTitle">מה בדרך כלל קונים</h2>
            <p>מסמנים רק מה שחסר.</p>
          </div>
          <input id="searchInput" type="search" autocomplete="off" placeholder="חיפוש" aria-label="חיפוש מוצר" />
        </div>
        <div class="list-tabs" role="tablist" aria-label="תצוגת רשימה">
          <button id="allItemsTab" type="button" role="tab" aria-selected="true">כל המוצרים</button>
          <button id="toBuyTab" type="button" role="tab" aria-selected="false">לקנייה</button>
        </div>
        <div id="groceryList" class="grocery-list"></div>
      </section>
    </main>

    <input id="receiptFile" class="receipt-file-input" type="file" accept=".pdf,application/pdf,.txt,.csv,.json,text/*" />
    <input id="receiptCamera" class="receipt-file-input" type="file" accept="image/*" capture="environment" />
    <div id="editDialog" class="modal-backdrop" hidden>
      <form id="editForm" class="modal-card">
        <h2>עריכת מוצר</h2>
        <label>
          שם מוצר
          <input id="editNameInput" type="text" autocomplete="off" required />
        </label>
        <label>
          קטגוריה
          <input id="editCategoryInput" type="text" autocomplete="off" list="categoryOptions" />
          <datalist id="categoryOptions"></datalist>
        </label>
        <label>
          מותג / גודל
          <input id="editNoteInput" type="text" autocomplete="off" />
        </label>
        <div class="modal-actions">
          <button id="cancelEditButton" class="secondary-button" type="button">בטל</button>
          <button type="submit">שמור</button>
        </div>
      </form>
    </div>
    <div id="deleteDialog" class="modal-backdrop" hidden>
      <div class="modal-card">
        <h2>להסיר מוצר?</h2>
        <p id="deleteMessage">המוצר יוסר מהרשימה.</p>
        <div class="modal-actions">
          <button id="cancelDeleteButton" class="secondary-button" type="button">בטל</button>
          <button id="confirmDeleteButton" class="danger-button" type="button">הסר</button>
        </div>
      </div>
    </div>
    <div id="shoppingListDialog" class="modal-backdrop" hidden>
      <div class="modal-card">
        <h2>רשימת קניות</h2>
        <textarea id="shoppingListText" class="shopping-list-output" rows="9" readonly></textarea>
        <div class="modal-actions is-three">
          <button id="closeShoppingListButton" class="secondary-button" type="button">סגור</button>
          <button id="copyShoppingListButton" type="button">העתק</button>
          <button id="shareShoppingListButton" type="button">שתף</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <script src="./app.js?v=to-buy-tab-1" type="module"></script>
  </body>
</html>
